<header [ngClass]="sidenav.mode === 'side' ? '' : 'opened'">
    <button matIconButton *ngIf="sidenav.mode === 'over'" (click)="sidenav.toggle()">
        <mat-icon *ngIf="!sidenav.opened"> menu </mat-icon>
        <mat-icon *ngIf="sidenav.opened"> close </mat-icon>
    </button>
    <app-menu></app-menu>
</header>
