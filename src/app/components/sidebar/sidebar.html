<mat-toolbar class="sidebar">
    <a class="dashboard-logo" routerLink="/overview">
        <mat-icon class="header-icon" svgIcon="ph-regular:speedometer"></mat-icon>
        <h6>Dashboard Project</h6>
    </a>
</mat-toolbar>

<mat-divider class="sidebar"></mat-divider>

<nav>
    <mat-nav-list>
        <a mat-list-item *ngFor="let page of pagesLinks" [routerLink]=page.route routerLinkActive="active"
            #rla="routerLinkActive">
            <mat-icon class="sidebar-icon" svgIcon="{{ rla.isActive ? page.iconActive : page.icon }}"></mat-icon>
            <span>{{ page.name }}</span>
        </a>

    </mat-nav-list>
</nav>
