<h4 class="page-heading">Account</h4>
<div class="wrapper">
    <mat-card appearance="outlined" class="account info">
        <mat-card-header class="info">
            <img mat-card-avatar mat-card-sm-image [src]="accounts[0].imgSrc" [alt]="accounts[0].imgAlt">
        </mat-card-header>
        <mat-card-content class="info">
            <h5>{{ accounts[0].firstName }} {{ accounts[0].lastName }}</h5>
            <p>{{ accounts[0].location }}</p>
            <p>{{ accounts[0].timezone }}</p>
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-actions>
            <button matButton class="info">Upload picture</button>
        </mat-card-actions>
    </mat-card>
    <mat-card appearance="outlined" class="account form">
        <mat-card-header class="form">
            <mat-card-title-group>
                <mat-card-title>Profile</mat-card-title>
                <mat-card-subtitle>The information can be edited</mat-card-subtitle>
            </mat-card-title-group>
        </mat-card-header>
        <mat-divider></mat-divider>
        <mat-card-content class="form">
            <form>
                <mat-form-field appearance="outline">
                    <mat-label>First name</mat-label>
                    <input matInput [value]="accounts[0].firstName" required>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Last name</mat-label>
                    <input matInput [value]="accounts[0].lastName" required>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Email address</mat-label>
                    <input matInput type="email" [value]="accounts[0].email" required>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Phone number</mat-label>
                    <input matInput>
                </mat-form-field>

                <mat-form-field appearance="outline" floatLabel="always">
                    <mat-label>State</mat-label>
                    <mat-select>
                        <mat-option *ngFor="let state of states" [value]="state.replaceAll(' ', '-').toLowerCase()"> {{
                            state }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>City</mat-label>
                    <input matInput>
                </mat-form-field>
            </form>
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-actions class="form">
            <button matButton="filled" class="form">Save details</button>
        </mat-card-actions>
    </mat-card>
</div>
