<h4 class="page-heading">Account</h4>
<div class="wrapper">
    <mat-card appearance="outlined" class="account info">
        <mat-card-header class="info">
            <img mat-card-avatar mat-card-sm-image
                src="https://dashboard-djonathas-projects.vercel.app/assets/avatar.png"
                alt="Avatar depicting Sofia Rivers">
        </mat-card-header>
        <mat-card-content class="info">
            <h5>Sofia Rivers</h5>
            <p>Los Angeles USA</p>
            <p>GTM-7</p>
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-actions>
            <button matButton class="account">Upload picture</button>
        </mat-card-actions>
    </mat-card>
    <mat-card appearance="outlined" class="account form">
        <mat-card-header class="form">
            <mat-card-title-group>
                <mat-card-title>Profile</mat-card-title>
                <mat-card-subtitle>The information can be edited</mat-card-subtitle>
            </mat-card-title-group>
        </mat-card-header>
        <mat-divider></mat-divider>
        <mat-card-content class="form">
            <form>
                <mat-form-field appearance="outline">
                    <mat-label>First name</mat-label>
                    <input matInput value="Sofia" required>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Last name</mat-label>
                    <input matInput value="Rivers" required>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Email address</mat-label>
                    <input matInput type="email" value="sofia@devias.io" required>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Phone number</mat-label>
                    <input matInput>
                </mat-form-field>

                <mat-form-field appearance="outline" floatLabel="always">
                    <mat-label>State</mat-label>
                    <mat-select>
                        <mat-option value="alabama">Alabama</mat-option>
                        <mat-option value="new-york">New York</mat-option>
                        <mat-option value="san-francisco">San Francisco</mat-option>
                        <mat-option value="los-angeles">Los Angeles</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>City</mat-label>
                    <input matInput>
                </mat-form-field>
            </form>
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-actions class="form">
            <button matButton="filled">Save details</button>
        </mat-card-actions>
    </mat-card>
</div>
