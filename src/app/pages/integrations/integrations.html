<app-page-heading [simpleHeading]="false" [pageTitle]="'Integrations'"></app-page-heading>

<app-search-box [placeholder]="'Search integration'"></app-search-box>

<div class="integrations-cards">
    <mat-card appearance="outlined" class="integrations integration-card" *ngFor="let app of integrationApps">
        <mat-card-header>
            <img mat-card-avatar [src]="app.logo" alt="">
            <mat-card-title>{{ app.name }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            {{ app.description }}
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-footer>
            <div class="info">
                <mat-icon svgIcon="ph-light:clock" style="height: 16px; min-width: 16px;"></mat-icon>
                <p>Updated {{ app.lastUpdated | date:'mediumDate' }}</p>
            </div>
            <div class="info">
                <mat-icon svgIcon="ph-light:download" style="height: 16px; min-width: 16px;"></mat-icon>
                <p>{{ app.installs }} installs</p>
            </div>
        </mat-card-footer>
    </mat-card>
</div>

<mat-paginator [length]="18" [pageSize]="6" [hidePageSize]="true"></mat-paginator>
