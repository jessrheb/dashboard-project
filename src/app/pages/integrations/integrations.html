<app-page-heading [simpleHeading]="false" [pageTitle]="'Integrations'"></app-page-heading>

<app-search-box [placeholder]="'Search integration'"></app-search-box>

<section class="integrations-cards">
    <mat-card appearance="outlined" class="integrations integration-card"
        *ngFor="let application of integrations$ | async">
        <mat-card-header>
            <img mat-card-avatar [src]="application.icon" alt="">
            <mat-card-title>{{ application.name }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            {{ application.description }}
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-footer>
            <div class="info">
                <mat-icon svgIcon="ph-light:clock" style="height: 16px; min-width: 16px;"></mat-icon>
                <p>Updated {{ application.updatedAt | date:'mediumDate' }}</p>
            </div>
            <div class="info">
                <mat-icon svgIcon="ph-light:download" style="height: 16px; min-width: 16px;"></mat-icon>
                <p>{{ application.installs }} installs</p>
            </div>
        </mat-card-footer>
    </mat-card>
</section>

<mat-paginator [length]="18" [pageSize]="6" [hidePageSize]="true"></mat-paginator>
