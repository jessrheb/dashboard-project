<h4 class="page-heading">Settings</h4>
<div class="wrapper">
    <mat-card appearance="outlined" class="settings">
        <mat-card-header class="settings">
            <mat-card-title-group>
                <mat-card-title>Notifications</mat-card-title>
                <mat-card-subtitle>Manage the notifications</mat-card-subtitle>
            </mat-card-title-group>
        </mat-card-header>
        <mat-divider></mat-divider>
        <mat-card-content class="settings checkboxes">
            <section class="checkboxes">
                <h5>Email</h5>
                <mat-checkbox [checked]="true">Product updates</mat-checkbox>
                <mat-checkbox>Security updates</mat-checkbox>
            </section>

            <section class="checkboxes">
                <h5>Phone</h5>
                <mat-checkbox [checked]="true">Email</mat-checkbox>
                <mat-checkbox>Security updates</mat-checkbox>
            </section>
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-actions>
            <button matButton="filled">Save changes</button>
        </mat-card-actions>
    </mat-card>

    <mat-card appearance="outlined" class="settings">
        <mat-card-header class="settings">
            <mat-card-title-group>
                <mat-card-title>Password</mat-card-title>
                <mat-card-subtitle>Update password</mat-card-subtitle>
            </mat-card-title-group>
        </mat-card-header>
        <mat-divider></mat-divider>
        <mat-card-content class="settings password">
            <form class="password">
                <mat-form-field appearance="outline">
                    <input matInput type="password" placeholder="Password">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <input matInput type="password" placeholder="Confirm password">
                </mat-form-field>
            </form>
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-actions>
            <button matButton="filled">Update</button>
        </mat-card-actions>
    </mat-card>
</div>
